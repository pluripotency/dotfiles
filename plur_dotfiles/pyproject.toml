[project]
name = "plur-dotfiles"
version = "0.1.0"
description = "better dotfiles setups"
readme = "README.md"
authors = [{ name = "Masayoshi Kokuryo", email = "masakoku@gmail.com" }]
requires-python = ">=3.15"
dependencies = ["plur>=0.22"]

[tool.uv.sources]
plur = { git = "https://github.com/pluripotency/plur" }

[project.scripts]
setup_menu = "plur_dotfiles.main:setup"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

